<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Red Ball Quest — Premium Edition</title>
<style>
:root{--gold:#ffd36b;--cyan:#8cecff;--panel:#0b1830}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#244d79,#081326 65%);color:#eef8ff;font-family:Inter,system-ui,Arial;display:flex;justify-content:center;min-height:100vh}
#app{width:min(100%,900px);padding:14px;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#ff8c83,#bd102c);box-shadow:inset 3px 3px 8px #ffffff80,inset -5px -6px 9px #65001480,0 5px 20px #f22a4b55;display:grid;place-items:center;font-size:25px}
h1{font-size:clamp(16px,4vw,22px);letter-spacing:1.4px;margin:0;color:#fff}header small{color:#94b9d8;font-size:10px;letter-spacing:2px}
button{border:1px solid #ffffff24;border-radius:13px;padding:12px 16px;background:linear-gradient(145deg,#ffe59a,#f5a928);color:#33200a;font-weight:900;font-size:14px;box-shadow:0 5px 0 #9b5b16,0 9px 20px #0005;cursor:pointer;touch-action:manipulation}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #9b5b16}
.secondary{background:linear-gradient(145deg,#24466d,#12243f);color:#e6f6ff;box-shadow:0 5px 0 #071326;border-color:#5e9cc455}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:linear-gradient(145deg,#183354,#0c1d36);border:1px solid #6ebbe32b;border-radius:13px;padding:9px;text-align:center;box-shadow:inset 0 1px #ffffff12}.stat small{display:block;color:#8eb4d2;font-size:9px;letter-spacing:1.4px}.stat b{font-size:15px;color:#fff}
#stage{position:relative;border:1px solid #6bd8ff55;border-radius:20px;overflow:hidden;background:#07172a;box-shadow:0 20px 60px #0008,0 0 28px #27baff1b}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;touch-action:none}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;background:linear-gradient(120deg,#061225df,#102b45d9);backdrop-filter:blur(7px)}
#overlay.hide{display:none}.modal{width:min(100%,450px);text-align:center;background:linear-gradient(145deg,#183655ee,#0b1b32f2);border:1px solid #8cecff55;border-radius:22px;padding:22px;box-shadow:0 18px 60px #0009,inset 0 1px #ffffff22}
.modal h2{font-size:clamp(24px,6vw,36px);margin:0 0 8px;color:var(--gold);text-shadow:0 3px 20px #ffb52a55}.modal p{color:#c1d9ec;line-height:1.5;font-size:13px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:16px 0}.levels button{padding:11px 0;background:linear-gradient(145deg,#3c6b91,#163652);color:#fff;box-shadow:0 4px 0 #08182b}.levels button.lock{opacity:.35;filter:grayscale(1)}
.controls{display:flex;justify-content:space-between;align-items:center;gap:12px}.pad{display:flex;gap:10px}.ctrl{width:68px;height:58px;padding:0;font-size:24px;border-radius:17px;background:linear-gradient(145deg,#d8f5ff,#77bde0);color:#092642;box-shadow:0 5px 0 #2a6389,0 8px 18px #0005;touch-action:none;user-select:none}.ctrl.jump{width:104px;background:linear-gradient(145deg,#ffe8a5,#ffad32);box-shadow:0 5px 0 #9b5b16;color:#412609;font-size:17px}
.hint{text-align:center;color:#7299b8;font-size:11px}.progress{height:5px;background:#ffffff18;border-radius:9px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#38e0f5,#ffe08b);width:0}
@media(max-width:480px){#app{padding:9px}.stat{padding:7px 3px}.stat b{font-size:12px}.ctrl{width:61px;height:54px}.ctrl.jump{width:92px}.modal{padding:15px}}
</style></head>
<body><main id="app">
<header><div class="brand"><div class="logo">●</div><div><h1>RED BALL QUEST</h1><small>PREMIUM ARCADE EDITION</small></div></div><button class="secondary" id="menu">☰ MENU</button></header>
<div class="hud">
<div class="stat"><small>LEVEL</small><b id="lv">01 / 10</b></div><div class="stat"><small>SCORE</small><b id="sc">00000</b></div><div class="stat"><small>LIVES</small><b id="hp">♥ ♥ ♥</b></div><div class="stat"><small>GEMS</small><b id="gem">0 / 0</b></div>
</div>
<section id="stage"><canvas id="game" width="960" height="540"></canvas><div id="overlay"><div class="modal" id="modal"></div></div></section>
<div class="progress"><i id="bar"></i></div>
<div class="controls"><div class="pad"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div><button class="ctrl jump" id="jump">JUMP ⤴</button></div>
<div class="hint">Hold ◀ ▶ to move · Hold JUMP for variable-height jumps · Keyboard: ← → Space</div>
</main>
<script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),W=960,H=540;
const overlay=document.querySelector('#overlay'),modal=document.querySelector('#modal');
const $=id=>document.getElementById(id);
const specs=[
{gap:[],platforms:[[160,400,150,24],[390,340,140,24],[630,390,145,24]],spikes:[300,520],coins:[[180,360],[240,360],[430,300],[490,300],[680,350],[730,350]],enemies:1,moving:0,goal:890},
{platforms:[[110,420,130,22],[300,350,120,22],[480,285,130,22],[690,360,130,22]],spikes:[260,430,610],coins:[[145,380],[340,310],[520,245],[735,320],[810,320]],enemies:2,moving:1,goal:900},
{platforms:[[120,380,110,22],[300,310,110,22],[500,390,110,22],[700,290,130,22]],spikes:[250,420,620,850],coins:[[150,340],[340,270],[540,350],[750,250],[800,250]],enemies:2,moving:1,goal:900},
{platforms:[[80,420,100,22],[230,355,100,22],[390,290,100,22],[550,355,100,22],[720,275,110,22]],spikes:[195,355,515,680,870],coins:[[110,380],[260,315],[420,250],[580,315],[755,235]],enemies:3,moving:1,goal:900},
{platforms:[[130,390,110,22],[320,300,100,22],[510,390,110,22],[700,300,110,22]],spikes:[260,390,460,650,850],coins:[[160,350],[350,260],[550,350],[740,260]],enemies:3,moving:2,goal:900},
{platforms:[[80,410,100,22],[230,335,100,22],[380,260,100,22],[540,335,100,22],[700,245,120,22]],spikes:[190,350,500,660,860],coins:[[110,370],[260,295],[410,220],[570,295],[745,205]],enemies:4,moving:2,goal:900},
{platforms:[[130,420,100,22],[300,345,100,22],[470,270,100,22],[640,345,100,22],[800,260,90,22]],spikes:[250,420,440,610,770],coins:[[160,380],[330,305],[500,230],[670,305],[830,220]],enemies:4,moving:3,goal:900},
{platforms:[[90,390,90,22],[240,310,90,22],[390,390,90,22],[540,300,90,22],[700,390,90,22],[830,285,80,22]],spikes:[200,350,500,650,790],coins:[[120,350],[270,270],[420,350],[570,260],[730,350],[855,245]],enemies:5,moving:3,goal:900},
{platforms:[[100,420,100,22],[260,350,90,22],[410,280,90,22],[560,350,90,22],[710,270,90,22],[850,360,70,22]],spikes:[220,380,520,670,810],coins:[[130,380],[290,310],[440,240],[590,310],[740,230],[875,320]],enemies:5,moving:4,goal:900},
{platforms:[[90,420,90,22],[230,340,90,22],[370,260,90,22],[510,340,90,22],[650,250,90,22],[790,330,100,22]],spikes:[190,360,470,620,760,900],coins:[[120,380],[260,300],[400,220],[540,300],[680,210],[820,290]],enemies:6,moving:5,goal:910}
];
let level=0,score=0,lives=3,unlocked=1,playing=false,cam=0,elapsed=0,particles=[],hurtCooldown=0;
let ball={x:55,y:440,vx:0,vy:0,r:19,ground:false,coyote:0,jumpBuffer:0};
let coins=[],spikes=[],platforms=[],enemies=[],keys={left:false,right:false,jump:false,jumpWas:false};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function initLevel(n){level=n;hurtCooldown=0;const s=specs[n];platforms=s.platforms.map(a=>[...a]);coins=s.coins.map(([x,y])=>({x,y,taken:false,phase:Math.random()*6}));spikes=s.spikes.map((x,i)=>({x,y:460,w:34,phase:i*.7}));enemies=Array.from({length:s.enemies},(_,i)=>({x:330+i*105,y:440,base:330+i*105,dir:i%2?1:-1,speed:1.1+n*.18,range:35+n*4,alive:true}));ball={x:55,y:440,vx:0,vy:0,r:19,ground:false,coyote:0,jumpBuffer:0};cam=0;elapsed=0;particles=[];playing=true;overlay.classList.add('hide');hud()}
function hud(){ $('lv').textContent=String(level+1).padStart(2,'0')+' / 10';$('sc').textContent=String(score).padStart(5,'0');$('hp').textContent='♥ '.repeat(lives)||'—';$('gem').textContent=coins.filter(c=>c.taken).length+' / '+coins.length;$('bar').style.width=(100*(level+1)/10)+'%'}
function show(content){modal.innerHTML=content;overlay.classList.remove('hide')}
function menu(){playing=false;show(`<h2>🔴 RED BALL QUEST</h2><p>Roll through a beautifully crafted world, collect every gem, dodge deadly traps and reach the portal. Can you conquer all ten stages?</p><div class="actions"><button id="start">▶ START ADVENTURE</button><button class="secondary" id="levels">LEVEL SELECT</button></div><p>PREMIUM EDITION · 10 CHALLENGING LEVELS</p>`);$('start').onclick=()=>{score=0;lives=3;initLevel(0)};$('levels').onclick=levelMenu}
function levelMenu(){playing=false;show(`<h2>CHOOSE YOUR STAGE</h2><p>Clear stages to unlock your next challenge.</p><div class="levels">${specs.map((s,i)=>`<button class="${i>=unlocked?'lock':''}" data-level="${i}" ${i>=unlocked?'disabled':''}>${i+1}${i>=unlocked?' 🔒':''}</button>`).join('')}</div><button class="secondary" id="back">BACK</button>`);document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{score=0;lives=3;initLevel(+b.dataset.level)});$('back').onclick=menu}
$('menu').onclick=()=>{if(playing){playing=false;show(`<h2>PAUSED</h2><p>Your adventure is waiting.</p><div class="actions"><button id="resume">RESUME</button><button class="secondary" id="quit">MAIN MENU</button></div>`);$('resume').onclick=()=>{playing=true;overlay.classList.add('hide')};$('quit').onclick=menu}else menu()};
function rounded(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function background(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#102b55');g.addColorStop(.55,'#277aa1');g.addColorStop(1,'#a4d7d0');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
let sun=ctx.createRadialGradient(760+cam*.05,100,5,760+cam*.05,100,110);sun.addColorStop(0,'#fff6c8aa');sun.addColorStop(1,'#fff6c800');ctx.fillStyle=sun;ctx.fillRect(620,0,280,230);
for(let layer=0;layer<3;layer++){let y=340+layer*48,shift=(cam*(.12+layer*.13))%400;ctx.fillStyle=['#234e72','#1b4961','#163d50'][layer];ctx.beginPath();ctx.moveTo(0,H);for(let x=-450;x<1400;x+=200){let xx=x-shift;ctx.lineTo(xx,y+Math.sin(x*.01+layer)*38);ctx.lineTo(xx+100,y-85-layer*12);ctx.lineTo(xx+200,y)}ctx.lineTo(W,H);ctx.fill()}
for(let i=0;i<36;i++){let x=(i*131-cam*.28)%W;if(x<0)x+=W;let y=35+(i*71)%245;ctx.fillStyle='#ffffff22';ctx.beginPath();ctx.arc(x,y,1.5+(i%3),0,7);ctx.fill()}}
function drawWorld(){background();ctx.save();ctx.translate(-cam,0);
// floor
let fg=ctx.createLinearGradient(0,460,0,540);fg.addColorStop(0,'#26765f');fg.addColorStop(1,'#103c3c');ctx.fillStyle=fg;ctx.fillRect(cam,460,960,80);
for(let x=Math.floor(cam/50)*50;x<cam+1000;x+=50){ctx.strokeStyle='#a4ffe522';ctx.beginPath();ctx.moveTo(x,466);ctx.lineTo(x+20,540);ctx.stroke()}
// platforms
platforms.forEach(([x,y,w,h])=>{let gr=ctx.createLinearGradient(x,y,x,y+h);gr.addColorStop(0,'#8ff0e5');gr.addColorStop(.18,'#277e87');gr.addColorStop(1,'#123b59');rounded(x,y,w,h,8,gr,'#aaffef99');ctx.fillStyle='#d8fff7';ctx.fillRect(x+8,y+4,w-16,3);for(let k=0;k<w;k+=24){ctx.fillStyle='#ffffff12';ctx.fillRect(x+k,y+10,2,h-12)}});
// spike traps
spikes.forEach(s=>{ctx.fillStyle='#ff5369';ctx.shadowColor='#ff274e';ctx.shadowBlur=12;ctx.beginPath();for(let i=0;i<4;i++){let x=s.x+i*9;ctx.moveTo(x,460);ctx.lineTo(x+5,438);ctx.lineTo(x+10,460)}ctx.fill();ctx.shadowBlur=0});
// gems
coins.forEach(c=>{if(c.taken)return;let bob=Math.sin(elapsed*3+c.phase)*5;ctx.save();ctx.translate(c.x,c.y+bob);ctx.rotate(Math.sin(elapsed*2+c.phase)*.25);ctx.shadowColor='#5ffbff';ctx.shadowBlur=18;let gr=ctx.createLinearGradient(-9,-13,9,13);gr.addColorStop(0,'#fff');gr.addColorStop(.35,'#9effff');gr.addColorStop(1,'#1684dd');ctx.fillStyle=gr;ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(10,0);ctx.lineTo(0,14);ctx.lineTo(-10,0);ctx.closePath();ctx.fill();ctx.strokeStyle='#e5ffff';ctx.stroke();ctx.restore()});
// enemies
enemies.forEach(e=>{if(!e.alive)return;ctx.save();ctx.translate(e.x,e.y-15);ctx.shadowColor='#ff4564';ctx.shadowBlur=15;let gr=ctx.createRadialGradient(-7,-8,2,0,0,22);gr.addColorStop(0,'#ffb0b6');gr.addColorStop(.4,'#f14d67');gr.addColorStop(1,'#7e1538');ctx.fillStyle=gr;ctx.beginPath();ctx.ellipse(0,0,19,16+Math.sin(elapsed*8+e.base)*2,0,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='white';ctx.beginPath();ctx.arc(-6,-3,4,0,7);ctx.arc(7,-3,4,0,7);ctx.fill();ctx.fillStyle='#1a2139';ctx.beginPath();ctx.arc(-5,-3,2,0,7);ctx.arc(8,-3,2,0,7);ctx.fill();ctx.restore()});
// portal
let gx=specs[level].goal;ctx.save();ctx.translate(gx,407);ctx.shadowColor='#63f8ff';ctx.shadowBlur=28;let pg=ctx.createLinearGradient(-16,-60,16,0);pg.addColorStop(0,'#c6ffff');pg.addColorStop(.5,'#23d7ef');pg.addColorStop(1,'#2859d7');ctx.strokeStyle=pg;ctx.lineWidth=9;ctx.beginPath();ctx.ellipse(0,0,21,48,0,0,7);ctx.stroke();ctx.restore();
// ball with faux 3D
ctx.save();if(hurtCooldown>0&&Math.floor(elapsed*18)%2===0)ctx.globalAlpha=.35;ctx.translate(ball.x,ball.y);ctx.rotate(ball.x*.035);ctx.shadowColor='#ff274b';ctx.shadowBlur=24;let bg=ctx.createRadialGradient(-8,-10,2,1,2,ball.r*1.5);bg.addColorStop(0,'#fff0e8');bg.addColorStop(.18,'#ff9b91');bg.addColorStop(.48,'#ff344e');bg.addColorStop(1,'#9c082d');ctx.fillStyle=bg;ctx.beginPath();ctx.arc(0,0,ball.r,0,7);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#ffd4d5aa';ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle='#ffffffaa';ctx.beginPath();ctx.ellipse(-7,-9,5,3,-.5,0,7);ctx.fill();ctx.restore();
particles.forEach(p=>{ctx.globalAlpha=clamp(p.life,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill();ctx.globalAlpha=1});
ctx.restore()}
function burst(x,y,color,n=10){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,v=1+Math.random()*4;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,size:2+Math.random()*3,color})}}
function collidePlatforms(oldY){ball.ground=false;let floor=460-ball.r;if(ball.y>=floor&&ball.vy>=0){ball.y=floor;ball.vy=0;ball.ground=true}
for(let [x,y,w,h] of platforms){if(ball.x+ball.r>x&&ball.x-ball.r<x+w&&ball.y+ball.r>y&&ball.y-ball.r<y+h){if(oldY+ball.r<=y+7&&ball.vy>=0){ball.y=y-ball.r;ball.vy=0;ball.ground=true}else if(oldY-ball.r>=y+h-5&&ball.vy<0){ball.y=y+h+ball.r;ball.vy=0}else if(ball.x<x+w/2)ball.x=x-ball.r;else ball.x=x+w+ball.r}}}
function hurt(){if(!playing||hurtCooldown>0)return;hurtCooldown=85;lives--;hud();burst(ball.x,ball.y,'#ff4564',20);if(lives<=0){playing=false;show(`<h2>RUN OVER</h2><p>Final score: ${score.toLocaleString()}</p><div class="actions"><button id="retry">RETRY STAGE</button><button class="secondary" id="home">MENU</button></div>`);$('retry').onclick=()=>{lives=3;initLevel(level)};$('home').onclick=menu}else{ball.x=Math.max(cam+45,cam+45);ball.y=390;ball.vx=0;ball.vy=-3;}}
function win(){playing=false;score+=150+coins.filter(c=>c.taken).length*20;unlocked=Math.max(unlocked,level+2);hud();show(`<h2>STAGE ${level+1} CLEAR!</h2><p>Portal reached! Stage bonus +150 · Gems collected: ${coins.filter(c=>c.taken).length}/${coins.length}</p><div class="actions"><button id="next">${level===9?'CLAIM VICTORY':'NEXT STAGE →'}</button></div>`);$('next').onclick=()=>{if(level===9){show(`<h2>🏆 CHAMPION!</h2><p>You conquered all ten premium stages! Final score: ${score}</p><button id="again">PLAY AGAIN</button>`);$('again').onclick=()=>{score=0;lives=3;initLevel(0)}}else initLevel(level+1)}}
let last=0;
function loop(t){let dt=Math.min((t-last)/16.67||1,2);last=t;elapsed+=dt/60;
if(playing){hurtCooldown=Math.max(0,hurtCooldown-dt);let accel=.72*dt,max=5.8+level*.12;if(keys.left)ball.vx-=accel;if(keys.right)ball.vx+=accel;if(!keys.left&&!keys.right)ball.vx*=Math.pow(.82,dt);ball.vx=clamp(ball.vx,-max,max);
if(ball.ground)ball.coyote=7;else ball.coyote=Math.max(0,ball.coyote-dt);if(keys.jump&&!keys.jumpWas)ball.jumpBuffer=8;else ball.jumpBuffer=Math.max(0,ball.jumpBuffer-dt);if(ball.jumpBuffer>0&&ball.coyote>0){ball.vy=-12.7;ball.ground=false;ball.coyote=0;ball.jumpBuffer=0;burst(ball.x,ball.y+ball.r,'#d9ffff',6)}if(!keys.jump&&ball.vy< -4)ball.vy+=.65*dt;keys.jumpWas=keys.jump;
let oldY=ball.y;ball.vy=Math.min(14,ball.vy+.52*dt);ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.x=Math.max(20,ball.x);collidePlatforms(oldY);
enemies.forEach(e=>{if(!e.alive)return;e.x+=e.dir*e.speed*dt;if(Math.abs(e.x-e.base)>e.range)e.dir*=-1;if(Math.hypot(ball.x-e.x,ball.y-(e.y-15))<ball.r+15){if(ball.vy>1&&ball.y<e.y-14){e.alive=false;ball.vy=-8;score+=50;burst(e.x,e.y,'#ffb2c5',15);hud()}else hurt()}});
coins.forEach(c=>{if(!c.taken&&Math.hypot(ball.x-c.x,ball.y-c.y)<ball.r+15){c.taken=true;score+=25;burst(c.x,c.y,'#9fffff',9);hud()}});
spikes.forEach(s=>{if(ball.x+ball.r>s.x&&ball.x-ball.r<s.x+s.w&&ball.y+ball.r>438)hurt()});
if(ball.y>570)hurt();cam=clamp(ball.x-330,0,960);if(ball.x>specs[level].goal-8)win();
particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.12*dt;p.life-=.025*dt});particles=particles.filter(p=>p.life>0);
}
drawWorld();requestAnimationFrame(loop)}
function bind(id,k){let el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;el.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,()=>keys[k]=false))}
bind('left','left');bind('right','right');bind('jump','jump');
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(e.code==='ArrowLeft')keys.left=true;if(e.code==='ArrowRight')keys.right=true;if(e.code==='Space')keys.jump=true});
addEventListener('keyup',e=>{if(e.code==='ArrowLeft')keys.left=false;if(e.code==='ArrowRight')keys.right=false;if(e.code==='Space')keys.jump=false});
menu();requestAnimationFrame(loop);
</script></body></html>
